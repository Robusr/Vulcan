<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="contract-title contract-desc">
  <title id="contract-title">The Vulcan JSON contract</title>
  <desc id="contract-desc">An annotated JSON feature tree with an extrude base and four cut holes, plus notes on envelope, feature types, shapes, units, and placement.</desc>
  <defs>
    <filter id="cs" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <style>
      .ui { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.2px; }
      .ln { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; fill: #475569; }
      .p { fill: #64748B; } .k { fill: #7DD3FC; } .s { fill: #FDBA74; } .n { fill: #C4B5FD; } .b { fill: #E2E8F0; }
      .title { font-size: 12.5px; font-weight: 700; fill: #0F172A; }
      .body { font-size: 11.2px; fill: #64748B; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.6px; fill: #475569; }
    </style>
  </defs>

  <rect width="1200" height="600" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="598" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text class="ui" x="48" y="56" font-size="26" font-weight="700" fill="#0F172A">The JSON contract</text>
  <text class="ui" x="48" y="84" font-size="14" fill="#64748B">A small, typed feature tree — not generated code.</text>

  <!-- code panel -->
  <rect x="40" y="112" width="680" height="446" rx="14" fill="#0B1120"/>
  <circle cx="64" cy="136" r="4" fill="#F87171"/><circle cx="78" cy="136" r="4" fill="#FBBF24"/><circle cx="92" cy="136" r="4" fill="#34D399"/>
  <text class="ui" x="110" y="140" font-size="11" fill="#94A3B8">response.json · abridged</text>
  <text class="ui" x="696" y="140" text-anchor="end" font-size="10" fill="#475569">application/json</text>

  <g>
    <text class="ln" x="68" y="180" text-anchor="end">1</text>
    <text class="code b" x="88" y="180">{</text>

    <text class="ln" x="68" y="199" text-anchor="end">2</text>
    <text class="code" x="88" y="199"><tspan class="k">"model_name"</tspan><tspan class="p">: </tspan><tspan class="s">"Mounting plate"</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="68" y="218" text-anchor="end">3</text>
    <text class="code" x="88" y="218"><tspan class="k">"features"</tspan><tspan class="p">: [</tspan></text>

    <text class="ln" x="68" y="237" text-anchor="end">4</text>
    <text class="code" x="88" y="237"><tspan class="p">{ </tspan><tspan class="k">"feature_type"</tspan><tspan class="p">: </tspan><tspan class="s">"extrude"</tspan><tspan class="p">, </tspan><tspan class="k">"name"</tspan><tspan class="p">: </tspan><tspan class="s">"Base"</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="68" y="256" text-anchor="end">5</text>
    <text class="code" x="88" y="256"><tspan class="p">  "params": { </tspan><tspan class="k">"plane"</tspan><tspan class="p">: </tspan><tspan class="s">"前视基准面"</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="68" y="275" text-anchor="end">6</text>
    <text class="code" x="88" y="275"><tspan class="p">              </tspan><tspan class="k">"shape"</tspan><tspan class="p">: </tspan><tspan class="s">"rectangle"</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="68" y="294" text-anchor="end">7</text>
    <text class="code" x="88" y="294"><tspan class="p">              </tspan><tspan class="k">"length"</tspan><tspan class="p">: </tspan><tspan class="n">200</tspan><tspan class="p">, </tspan><tspan class="k">"width"</tspan><tspan class="p">: </tspan><tspan class="n">100</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="68" y="313" text-anchor="end">8</text>
    <text class="code" x="88" y="313"><tspan class="p">              </tspan><tspan class="k">"depth"</tspan><tspan class="p">: </tspan><tspan class="n">20</tspan><tspan class="p"> } },</tspan></text>

    <text class="ln" x="68" y="332" text-anchor="end">9</text>
    <text class="code" x="88" y="332"><tspan class="p">{ </tspan><tspan class="k">"feature_type"</tspan><tspan class="p">: </tspan><tspan class="s">"cut"</tspan><tspan class="p">, </tspan><tspan class="k">"name"</tspan><tspan class="p">: </tspan><tspan class="s">"Hole 1"</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="68" y="351" text-anchor="end">10</text>
    <text class="code" x="88" y="351"><tspan class="p">  "params": { </tspan><tspan class="k">"plane"</tspan><tspan class="p">: </tspan><tspan class="s">"前视基准面"</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="68" y="370" text-anchor="end">11</text>
    <text class="code" x="88" y="370"><tspan class="p">              </tspan><tspan class="k">"shape"</tspan><tspan class="p">: </tspan><tspan class="s">"circle"</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="68" y="389" text-anchor="end">12</text>
    <text class="code" x="88" y="389"><tspan class="p">              </tspan><tspan class="k">"diameter"</tspan><tspan class="p">: </tspan><tspan class="n">10</tspan><tspan class="p">, </tspan><tspan class="k">"depth"</tspan><tspan class="p">: </tspan><tspan class="n">20</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="68" y="408" text-anchor="end">13</text>
    <text class="code" x="88" y="408"><tspan class="p">              </tspan><tspan class="k">"through_all"</tspan><tspan class="p">: </tspan><tspan class="n">true</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="68" y="427" text-anchor="end">14</text>
    <text class="code" x="88" y="427"><tspan class="p">              </tspan><tspan class="k">"center_x"</tspan><tspan class="p">: </tspan><tspan class="n">90</tspan><tspan class="p">, </tspan><tspan class="k">"center_y"</tspan><tspan class="p">: </tspan><tspan class="n">40</tspan><tspan class="p"> } },</tspan></text>

    <text class="ln" x="68" y="446" text-anchor="end">15</text>
    <text class="code" x="88" y="446"><tspan class="p">{ </tspan><tspan class="k">"feature_type"</tspan><tspan class="p">: </tspan><tspan class="s">"cut"</tspan><tspan class="p">, </tspan><tspan class="k">"name"</tspan><tspan class="p">: </tspan><tspan class="s">"Hole 2"</tspan><tspan class="p">, </tspan><tspan class="s">"…"</tspan><tspan class="p"> },</tspan></text>

    <text class="ln" x="68" y="465" text-anchor="end">16</text>
    <text class="code" x="88" y="465"><tspan class="p">{ </tspan><tspan class="k">"feature_type"</tspan><tspan class="p">: </tspan><tspan class="s">"cut"</tspan><tspan class="p">, </tspan><tspan class="k">"name"</tspan><tspan class="p">: </tspan><tspan class="s">"Hole 3"</tspan><tspan class="p">, </tspan><tspan class="s">"…"</tspan><tspan class="p"> },</tspan></text>

    <text class="ln" x="68" y="484" text-anchor="end">17</text>
    <text class="code" x="88" y="484"><tspan class="p">{ </tspan><tspan class="k">"feature_type"</tspan><tspan class="p">: </tspan><tspan class="s">"cut"</tspan><tspan class="p">, </tspan><tspan class="k">"name"</tspan><tspan class="p">: </tspan><tspan class="s">"Hole 4"</tspan><tspan class="p">, </tspan><tspan class="s">"…"</tspan><tspan class="p"> }</tspan></text>

    <text class="ln" x="68" y="503" text-anchor="end">18</text>
    <text class="code p" x="88" y="503">  ]</text>

    <text class="ln" x="68" y="522" text-anchor="end">19</text>
    <text class="code b" x="88" y="522">}</text>
  </g>

  <!-- annotations -->
  <rect x="744" y="112" width="416" height="82" rx="10" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#cs)"/>
  <text class="ui" x="762" y="134" font-size="10.5" font-weight="700" fill="#C2410C">01</text>
  <text class="ui title" x="784" y="134">Envelope</text>
  <text class="ui body" x="762" y="156">Single feature (<tspan class="mono">feature_type</tspan> + <tspan class="mono">params</tspan>)</text>
  <text class="ui body" x="762" y="174">or an ordered <tspan class="mono">features[]</tspan> array.</text>

  <rect x="744" y="204" width="416" height="74" rx="10" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#cs)"/>
  <text class="ui" x="762" y="226" font-size="10.5" font-weight="700" fill="#C2410C">02</text>
  <text class="ui title" x="784" y="226">Feature types</text>
  <text class="ui body" x="762" y="248"><tspan class="mono">extrude</tspan> adds material; <tspan class="mono">cut</tspan> removes it.</text>
  <text class="ui body" x="762" y="266">Order matters: the base comes first.</text>

  <rect x="744" y="288" width="416" height="102" rx="10" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#cs)"/>
  <text class="ui" x="762" y="310" font-size="10.5" font-weight="700" fill="#C2410C">03</text>
  <text class="ui title" x="784" y="310">Shape parameters</text>
  <text class="ui body" x="762" y="332"><tspan class="mono">circle</tspan> → diameter</text>
  <text class="ui body" x="762" y="350"><tspan class="mono">rectangle</tspan>, <tspan class="mono">slot</tspan> → length, width</text>
  <text class="ui body" x="762" y="368"><tspan class="mono">polygon</tspan> → diameter, sides (3–100)</text>
  <text class="ui body" x="762" y="386"><tspan class="mono">ellipse</tspan> → major_axis, minor_axis</text>

  <rect x="744" y="400" width="416" height="68" rx="10" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#cs)"/>
  <text class="ui" x="762" y="422" font-size="10.5" font-weight="700" fill="#C2410C">04</text>
  <text class="ui title" x="784" y="422">Units</text>
  <text class="ui body" x="762" y="444">Millimetres in JSON; metres at the COM boundary.</text>
  <text class="ui body" x="762" y="462">Optional fields fall back to modeler defaults.</text>

  <rect x="744" y="478" width="416" height="80" rx="10" fill="#F8FAFC" stroke="#E2E8F0" filter="url(#cs)"/>
  <text class="ui" x="762" y="500" font-size="10.5" font-weight="700" fill="#C2410C">05</text>
  <text class="ui title" x="784" y="500">Placement</text>
  <text class="ui body" x="762" y="522"><tspan class="mono">center_x</tspan> / <tspan class="mono">center_y</tspan> position the sketch.</text>
  <text class="ui body" x="762" y="540"><tspan class="mono">through_all</tspan> cuts in both directions.</text>

  <text class="ui" x="48" y="584" font-size="11.5" fill="#94A3B8">The server checks the envelope; the C# client deserializes typed classes and applies defaults.</text>
</svg>
