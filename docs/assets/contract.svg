<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="contract-title contract-desc">
  <title id="contract-title">The Vulcan JSON contract</title>
  <desc id="contract-desc">An annotated JSON feature tree: a mounting-plate base extrude followed by four through-hole cuts, with notes on the envelope, feature order, shape parameters, units and placement, and the feature library.</desc>
  <defs>
    <style>
      .ui { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .code { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 11.2px; }
      .ln { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 9.5px; fill: #9A9A93; }
      .p { fill: #8A8A83; }
      .k { fill: #171717; font-weight: 700; }
      .s { fill: #2F5D7A; }
      .n { fill: #C8102E; }
      .b { fill: #171717; }
      .cardTitle { font-size: 12.5px; font-weight: 700; fill: #171717; }
      .body { font-size: 10.8px; fill: #55554F; }
      .small { font-size: 9.8px; fill: #6E6E67; }
      .tag { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 9.5px; fill: #C8102E; font-weight: 700; }
      .num { font-size: 9.5px; font-weight: 700; fill: #C8102E; }
    </style>
  </defs>

  <rect width="1200" height="640" fill="#FFFFFF"/>
  <text class="ui" x="1152" y="44" text-anchor="end" font-size="10" font-weight="700" letter-spacing="2" fill="#8A8A83">DATA CONTRACT</text>
  <text class="ui" x="48" y="58" font-size="26" font-weight="700" fill="#171717">The JSON contract</text>
  <text class="ui" x="48" y="86" font-size="14" fill="#66665F">A small, ordered feature tree — not generated code.</text>
  <line x1="48" y1="106" x2="1152" y2="106" stroke="#DADAD4"/>

  <!-- code card -->
  <rect x="40" y="126" width="620" height="446" fill="#FAFAF8" stroke="#DADAD4"/>
  <line x1="40" y1="166" x2="660" y2="166" stroke="#DADAD4"/>
  <text class="ui" x="56" y="149" font-size="10.5" font-weight="700" fill="#55554F">response.json · abridged</text>
  <text class="ui" x="644" y="149" text-anchor="end" font-size="9.5" fill="#8A8A83">application/json</text>

  <g class="code" xml:space="preserve" style="white-space: pre">
    <text class="ln" x="70" y="192" text-anchor="end">1</text>
    <text class="b" x="88" y="192">{</text>
    <text class="tag" x="644" y="192" text-anchor="end">01</text>

    <text class="ln" x="70" y="211.5" text-anchor="end">2</text>
    <text x="88" y="211.5"><tspan class="k">"model_name"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"Mounting&#160;plate"</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="70" y="231" text-anchor="end">3</text>
    <text x="88" y="231"><tspan class="k">"features"</tspan><tspan class="p">:&#160;[</tspan></text>

    <text class="ln" x="70" y="250.5" text-anchor="end">4</text>
    <text x="88" y="250.5"><tspan class="p">{&#160;</tspan><tspan class="k">"feature_type"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"extrude"</tspan><tspan class="p">,&#160;</tspan><tspan class="k">"name"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"Base"</tspan><tspan class="p">,</tspan></text>
    <text class="tag" x="644" y="250.5" text-anchor="end">02</text>

    <text class="ln" x="70" y="270" text-anchor="end">5</text>
    <text x="88" y="270"><tspan class="p">&#160;&#160;"params":&#160;{&#160;</tspan><tspan class="k">"plane"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"前视基准面"</tspan><tspan class="p">,</tspan></text>
    <text class="tag" x="644" y="270" text-anchor="end">03</text>

    <text class="ln" x="70" y="289.5" text-anchor="end">6</text>
    <text x="88" y="289.5"><tspan class="p">              </tspan><tspan class="k">"shape"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"rectangle"</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="70" y="309" text-anchor="end">7</text>
    <text x="88" y="309"><tspan class="p">              </tspan><tspan class="k">"length"</tspan><tspan class="p">:&#160;</tspan><tspan class="n">200</tspan><tspan class="p">,&#160;</tspan><tspan class="k">"width"</tspan><tspan class="p">:&#160;</tspan><tspan class="n">100</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="70" y="328.5" text-anchor="end">8</text>
    <text x="88" y="328.5"><tspan class="p">              </tspan><tspan class="k">"depth"</tspan><tspan class="p">:&#160;</tspan><tspan class="n">20</tspan><tspan class="p">&#160;}&#160;},</tspan></text>

    <text class="ln" x="70" y="348" text-anchor="end">9</text>
    <text x="88" y="348"><tspan class="p">{&#160;</tspan><tspan class="k">"feature_type"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"cut"</tspan><tspan class="p">,&#160;</tspan><tspan class="k">"name"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"Hole&#160;1"</tspan><tspan class="p">,</tspan></text>
    <text class="tag" x="644" y="348" text-anchor="end">02</text>

    <text class="ln" x="70" y="367.5" text-anchor="end">10</text>
    <text x="88" y="367.5"><tspan class="p">&#160;&#160;"params":&#160;{&#160;</tspan><tspan class="k">"plane"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"前视基准面"</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="70" y="387" text-anchor="end">11</text>
    <text x="88" y="387"><tspan class="p">              </tspan><tspan class="k">"shape"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"circle"</tspan><tspan class="p">,</tspan></text>
    <text class="tag" x="644" y="387" text-anchor="end">03</text>

    <text class="ln" x="70" y="406.5" text-anchor="end">12</text>
    <text x="88" y="406.5"><tspan class="p">              </tspan><tspan class="k">"diameter"</tspan><tspan class="p">:&#160;</tspan><tspan class="n">10</tspan><tspan class="p">,&#160;</tspan><tspan class="k">"depth"</tspan><tspan class="p">:&#160;</tspan><tspan class="n">20</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="70" y="426" text-anchor="end">13</text>
    <text x="88" y="426"><tspan class="p">              </tspan><tspan class="k">"through_all"</tspan><tspan class="p">:&#160;</tspan><tspan class="n">true</tspan><tspan class="p">,</tspan></text>

    <text class="ln" x="70" y="445.5" text-anchor="end">14</text>
    <text x="88" y="445.5"><tspan class="p">              </tspan><tspan class="k">"center_x"</tspan><tspan class="p">:&#160;</tspan><tspan class="n">90</tspan><tspan class="p">,&#160;</tspan><tspan class="k">"center_y"</tspan><tspan class="p">:&#160;</tspan><tspan class="n">40</tspan><tspan class="p">&#160;}&#160;},</tspan></text>
    <text class="tag" x="644" y="445.5" text-anchor="end">04</text>

    <text class="ln" x="70" y="465" text-anchor="end">15</text>
    <text x="88" y="465"><tspan class="p">{&#160;</tspan><tspan class="k">"feature_type"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"cut"</tspan><tspan class="p">,&#160;</tspan><tspan class="k">"name"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"Hole&#160;2"</tspan><tspan class="p">,&#160;</tspan><tspan class="s">"…"</tspan><tspan class="p">&#160;},</tspan></text>
    <text class="tag" x="644" y="465" text-anchor="end">05</text>

    <text class="ln" x="70" y="484.5" text-anchor="end">16</text>
    <text x="88" y="484.5"><tspan class="p">{&#160;</tspan><tspan class="k">"feature_type"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"cut"</tspan><tspan class="p">,&#160;</tspan><tspan class="k">"name"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"Hole&#160;3"</tspan><tspan class="p">,&#160;</tspan><tspan class="s">"…"</tspan><tspan class="p">&#160;},</tspan></text>

    <text class="ln" x="70" y="504" text-anchor="end">17</text>
    <text x="88" y="504"><tspan class="p">{&#160;</tspan><tspan class="k">"feature_type"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"cut"</tspan><tspan class="p">,&#160;</tspan><tspan class="k">"name"</tspan><tspan class="p">:&#160;</tspan><tspan class="s">"Hole&#160;4"</tspan><tspan class="p">,&#160;</tspan><tspan class="s">"…"</tspan><tspan class="p">&#160;}</tspan></text>

    <text class="ln" x="70" y="523.5" text-anchor="end">18</text>
    <text class="p" x="88" y="523.5">&#160;&#160;]</text>

    <text class="ln" x="70" y="543" text-anchor="end">19</text>
    <text class="b" x="88" y="543">}</text>
  </g>

  <!-- annotations -->
  <rect x="696" y="126" width="456" height="78" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui num" x="714" y="148">01</text>
  <text class="ui cardTitle" x="736" y="148">Envelope</text>
  <text class="ui body" x="714" y="170">One feature (<tspan font-family="monospace" font-size="10">feature_type</tspan> + <tspan font-family="monospace" font-size="10">params</tspan>)</text>
  <text class="ui body" x="714" y="188">or an ordered <tspan font-family="monospace" font-size="10">features[]</tspan> array — never both.</text>

  <rect x="696" y="220" width="456" height="78" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui num" x="714" y="242">02</text>
  <text class="ui cardTitle" x="736" y="242">Order</text>
  <text class="ui body" x="714" y="264">The base extrude comes first; cuts follow.</text>
  <text class="ui body" x="714" y="282"><tspan font-family="monospace" font-size="10">seed</tspan> references an earlier feature by name.</text>

  <rect x="696" y="314" width="456" height="104" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui num" x="714" y="336">03</text>
  <text class="ui cardTitle" x="736" y="336">Shape parameters</text>
  <text class="ui body" x="714" y="358"><tspan font-family="monospace" font-size="10">circle</tspan> → diameter; <tspan font-family="monospace" font-size="10">rectangle</tspan> / <tspan font-family="monospace" font-size="10">slot</tspan> → length, width</text>
  <text class="ui body" x="714" y="376"><tspan font-family="monospace" font-size="10">polygon</tspan> → diameter, sides (3–100)</text>
  <text class="ui body" x="714" y="394"><tspan font-family="monospace" font-size="10">ellipse</tspan> → major_axis, minor_axis</text>

  <rect x="696" y="434" width="456" height="78" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui num" x="714" y="456">04</text>
  <text class="ui cardTitle" x="736" y="456">Units &amp; placement</text>
  <text class="ui body" x="714" y="478">Millimetres in JSON; metres at the COM boundary.</text>
  <text class="ui body" x="714" y="496"><tspan font-family="monospace" font-size="10">center_x</tspan> / <tspan font-family="monospace" font-size="10">center_y</tspan> place the sketch; <tspan font-family="monospace" font-size="10">through_all</tspan> cuts both ways.</text>

  <rect x="696" y="528" width="456" height="78" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui num" x="714" y="550">05</text>
  <text class="ui cardTitle" x="736" y="550">Feature library</text>
  <text class="ui body" x="714" y="572">Extrude, cut, revolve, fillet, chamfer, patterns, mirror,</text>
  <text class="ui body" x="714" y="590">shell, draft, sweep, loft, rib, holes, notes, inserts.</text>

  <text class="ui small" x="48" y="620" font-size="10.4">The server checks the envelope and parameters; the client deserializes typed classes and opens the tree in an editable preview before execution.</text>
</svg>
