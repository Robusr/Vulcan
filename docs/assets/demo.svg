<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="demo-title demo-desc">
  <title id="demo-title">One sentence to an editable part</title>
  <desc id="demo-desc">Three panels: a Chinese prompt in the Vulcan task pane, the editable JSON preview with live validation, and the resulting native cylinder feature tree in SolidWorks.</desc>
  <defs>
    <marker id="da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8A8A83"/>
    </marker>
    <style>
      .ui { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
      .kicker { font-size: 10px; font-weight: 700; letter-spacing: 1.8px; fill: #C8102E; }
      .title { font-size: 15px; font-weight: 700; fill: #171717; }
      .body { font-size: 10.8px; fill: #55554F; }
      .code { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 10.2px; fill: #2E2E2E; }
      .tree { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 9.6px; fill: #2E2E2E; }
      .note { font-size: 10px; fill: #6E6E67; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#FFFFFF"/>
  <text class="ui" x="1152" y="44" text-anchor="end" font-size="10" font-weight="700" letter-spacing="2" fill="#8A8A83">WORKED EXAMPLE</text>
  <text class="ui" x="48" y="58" font-size="26" font-weight="700" fill="#171717">One sentence. One editable part.</text>
  <text class="ui" x="48" y="86" font-size="14" fill="#66665F">Describe the part, review or edit the JSON, then let the add-in build native features.</text>
  <line x1="48" y1="106" x2="1152" y2="106" stroke="#DADAD4"/>

  <!-- panel 1 -->
  <rect x="40" y="126" width="352" height="368" fill="#FAFAF8" stroke="#DADAD4"/>
  <text class="ui kicker" x="64" y="156">1 · INPUT</text>
  <text class="ui title" x="64" y="184">Describe the part</text>
  <rect x="64" y="202" width="304" height="128" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui" x="80" y="230" font-size="12.2" fill="#171717">在前视基准面拉伸一个直径 40、</text>
  <text class="ui" x="80" y="252" font-size="12.2" fill="#171717">高度 60 的圆柱体。</text>
  <text class="ui note" x="80" y="312">Chinese · English · French</text>
  <rect x="64" y="346" width="120" height="36" fill="#C8102E"/>
  <text class="ui" x="124" y="369" text-anchor="middle" font-size="12" font-weight="700" fill="#FFFFFF">开始生成</text>
  <text class="ui note" x="200" y="369">streamed over SSE</text>
  <circle cx="70" cy="414" r="4" fill="#C8102E"/>
  <text class="ui body" x="84" y="418">Ready · docked task pane</text>
  <text class="ui note" x="64" y="452">The prompt stays local until you press generate.</text>

  <!-- panel 2 -->
  <rect x="424" y="126" width="352" height="368" fill="#FAFAF8" stroke="#DADAD4"/>
  <text class="ui kicker" x="448" y="156">2 · REVIEW</text>
  <text class="ui title" x="448" y="184">Edit the JSON</text>
  <rect x="448" y="202" width="304" height="168" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="code" x="464" y="226">{</text>
  <text class="code" x="464" y="246">  "feature_type": "extrude",</text>
  <text class="code" x="464" y="266">  "params": {</text>
  <text class="code" x="464" y="286">    "plane": "前视基准面",</text>
  <text class="code" x="464" y="306">    "shape": "circle",</text>
  <text class="code" x="464" y="326">    "diameter": 40,</text>
  <text class="code" x="464" y="346">    "depth": 60 }</text>
  <text class="code" x="464" y="360">}</text>
  <text class="ui note" x="448" y="392">live validation · schema valid</text>
  <rect x="448" y="406" width="112" height="32" fill="#C8102E"/>
  <text class="ui" x="504" y="427" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">执行建模</text>
  <rect x="572" y="406" width="72" height="32" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui" x="608" y="427" text-anchor="middle" font-size="11" fill="#55554F">取消</text>
  <text class="ui note" x="448" y="452">Nothing is written until you confirm.</text>

  <!-- panel 3 -->
  <rect x="808" y="126" width="352" height="368" fill="#FAFAF8" stroke="#DADAD4"/>
  <text class="ui kicker" x="832" y="156">3 · BUILD</text>
  <text class="ui title" x="832" y="184">Native feature tree</text>

  <rect x="832" y="202" width="140" height="150" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="tree" x="846" y="224">零件1</text>
  <text class="tree" x="846" y="244">├ 前视基准面</text>
  <text class="tree" x="846" y="264">├ 草图1</text>
  <text class="tree" x="846" y="284">│  └ ⌀40</text>
  <text class="tree" x="846" y="304">└ 凸台-拉伸1</text>
  <text class="tree" x="846" y="324">   └ 深度 60</text>

  <g transform="translate(1030 290)">
    <ellipse cx="0" cy="0" rx="56" ry="25" fill="#F4F4F0" stroke="#8A8A83"/>
    <path d="M-56 0v48a56 25 0 0 0 112 0V0" fill="#E8E8E2" stroke="#8A8A83"/>
    <ellipse cx="0" cy="48" rx="56" ry="25" fill="#F4F4F0" stroke="#8A8A83"/>
    <ellipse cx="0" cy="0" rx="34" ry="15" fill="none" stroke="#C8102E" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="2" fill="#C8102E"/>
  </g>
  <text class="ui note" x="1030" y="402" text-anchor="middle">⌀40 × 60 mm · 前视基准面</text>
  <text class="ui note" x="832" y="444">Editable features, not a mesh,</text>
  <text class="ui note" x="832" y="460">macro, or generated script.</text>

  <!-- flow -->
  <line x1="392" y1="310" x2="424" y2="310" stroke="#8A8A83" stroke-width="1.4" marker-end="url(#da)"/>
  <line x1="776" y1="310" x2="808" y2="310" stroke="#8A8A83" stroke-width="1.4" marker-end="url(#da)"/>

  <text class="ui note" x="48" y="528" font-size="10.4">Illustrative. The preview is editable; cancelling leaves the document untouched.</text>
</svg>
