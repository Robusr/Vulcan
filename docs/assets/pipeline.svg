<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">Vulcan request lifecycle</title>
  <desc id="pipe-desc">Six stages from natural language to SolidWorks execution, with typical latency and failure handling.</desc>
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#94A3B8"/>
    </marker>
    <filter id="ps" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
    <style>
      .ui { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .t { font-size: 13.5px; font-weight: 700; fill: #0F172A; }
      .d { font-size: 10.8px; fill: #64748B; }
      .m { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; fill: #475569; }
      .n { font-size: 11px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="500" fill="#F8FAFC"/>
  <rect x="1" y="1" width="1198" height="498" rx="18" fill="#FFFFFF" stroke="#E2E8F0"/>
  <text class="ui" x="48" y="54" font-size="26" font-weight="700" fill="#0F172A">Request lifecycle</text>
  <text class="ui" x="48" y="82" font-size="14" fill="#64748B">Six stages, one round trip, deterministic execution on the client.</text>

  <!-- stage cards -->
  <g>
    <rect x="40" y="128" width="168" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#ps)"/>
    <rect x="40" y="128" width="168" height="4" rx="2" fill="#64748B"/>
    <circle cx="62" cy="154" r="10" fill="#64748B"/><text class="ui n" x="62" y="158" text-anchor="middle">1</text>
    <text class="ui t" x="58" y="190">Natural language</text>
    <text class="ui d" x="58" y="214">An engineer writes</text>
    <text class="ui d" x="58" y="232">the request in plain</text>
    <text class="ui d" x="58" y="250">Chinese, English,</text>
    <text class="ui d" x="58" y="268">or French.</text>
  </g>
  <g>
    <rect x="224" y="128" width="168" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#ps)"/>
    <rect x="224" y="128" width="168" height="4" rx="2" fill="#2563EB"/>
    <circle cx="246" cy="154" r="10" fill="#2563EB"/><text class="ui n" x="246" y="158" text-anchor="middle">2</text>
    <text class="ui t" x="242" y="190">Prompt assembly</text>
    <text class="ui d" x="242" y="214">System prompt plus</text>
    <text class="ui d" x="242" y="232">user text. The domain</text>
    <text class="ui d" x="242" y="250">spec is versioned</text>
    <text class="ui m" x="242" y="268">PROMPT_VERSION 2.0.0</text>
  </g>
  <g>
    <rect x="408" y="128" width="168" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#ps)"/>
    <rect x="408" y="128" width="168" height="4" rx="2" fill="#7C3AED"/>
    <circle cx="430" cy="154" r="10" fill="#7C3AED"/><text class="ui n" x="430" y="158" text-anchor="middle">3</text>
    <text class="ui t" x="426" y="190">LLM call</text>
    <text class="ui d" x="426" y="214">OpenAI-compatible</text>
    <text class="ui d" x="426" y="232">endpoint, low</text>
    <text class="ui d" x="426" y="250">temperature, JSON</text>
    <text class="ui d" x="426" y="268">feature tree output.</text>
  </g>
  <g>
    <rect x="592" y="128" width="168" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#ps)"/>
    <rect x="592" y="128" width="168" height="4" rx="2" fill="#D97706"/>
    <circle cx="614" cy="154" r="10" fill="#D97706"/><text class="ui n" x="614" y="158" text-anchor="middle">4</text>
    <text class="ui t" x="610" y="190">JSON recovery</text>
    <text class="ui d" x="610" y="214">Strip code fences,</text>
    <text class="ui d" x="610" y="232">then take the first</text>
    <text class="ui m" x="610" y="252">{ ... }</text>
    <text class="ui d" x="610" y="270">substring and parse.</text>
  </g>
  <g>
    <rect x="776" y="128" width="168" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#ps)"/>
    <rect x="776" y="128" width="168" height="4" rx="2" fill="#059669"/>
    <circle cx="798" cy="154" r="10" fill="#059669"/><text class="ui n" x="798" y="158" text-anchor="middle">5</text>
    <text class="ui t" x="794" y="190">Schema check</text>
    <text class="ui d" x="794" y="214">Envelope validation,</text>
    <text class="ui d" x="794" y="232">typed model classes,</text>
    <text class="ui d" x="794" y="250">defaults for missing</text>
    <text class="ui d" x="794" y="268">optional fields.</text>
  </g>
  <g>
    <rect x="960" y="128" width="168" height="152" rx="12" fill="#FFFFFF" stroke="#E2E8F0" filter="url(#ps)"/>
    <rect x="960" y="128" width="168" height="4" rx="2" fill="#F97316"/>
    <circle cx="982" cy="154" r="10" fill="#F97316"/><text class="ui n" x="982" y="158" text-anchor="middle">6</text>
    <text class="ui t" x="978" y="190">COM execution</text>
    <text class="ui d" x="978" y="214">Sketch, extrude, cut.</text>
    <text class="ui m" x="978" y="234">FeatureExtrusion3</text>
    <text class="ui m" x="978" y="250">FeatureCut4</text>
    <text class="ui d" x="978" y="270">UI fallback if needed.</text>
  </g>

  <!-- stage arrows -->
  <g stroke="#94A3B8" stroke-width="1.4">
    <line x1="208" y1="204" x2="222" y2="204" marker-end="url(#pa)"/>
    <line x1="392" y1="204" x2="406" y2="204" marker-end="url(#pa)"/>
    <line x1="576" y1="204" x2="590" y2="204" marker-end="url(#pa)"/>
    <line x1="760" y1="204" x2="774" y2="204" marker-end="url(#pa)"/>
    <line x1="944" y1="204" x2="958" y2="204" marker-end="url(#pa)"/>
  </g>

  <!-- latency -->
  <text class="ui" x="48" y="326" font-size="12" font-weight="700" fill="#334155">Typical latency</text>
  <text class="ui" x="48" y="344" font-size="11" fill="#94A3B8">Local steps are milliseconds; the model call dominates.</text>
  <rect x="40" y="358" width="1088" height="16" rx="8" fill="#F1F5F9"/>
  <rect x="40" y="358" width="180" height="16" rx="8" fill="#CBD5E1"/>
  <rect x="220" y="358" width="620" height="16" fill="#C4B5FD"/>
  <rect x="840" y="358" width="170" height="16" fill="#A7F3D0"/>
  <rect x="1010" y="358" width="118" height="16" rx="8" fill="#FDBA74"/>
  <text class="ui" x="130" y="390" text-anchor="middle" font-size="10.5" fill="#475569">~1 ms</text>
  <text class="ui" x="530" y="390" text-anchor="middle" font-size="10.5" fill="#5B21B6">2–20 s</text>
  <text class="ui" x="925" y="390" text-anchor="middle" font-size="10.5" fill="#047857">~1 ms</text>
  <text class="ui" x="1069" y="390" text-anchor="middle" font-size="10.5" fill="#9A3412">0.2–2 s</text>

  <!-- guardrails -->
  <rect x="40" y="412" width="350" height="58" rx="10" fill="#FFFBEB" stroke="#FDE68A"/>
  <text class="ui" x="58" y="434" font-size="11.5" font-weight="700" fill="#92400E">Recover</text>
  <text class="ui" x="58" y="454" font-size="11" fill="#78716C">Code fences and prose are stripped before parsing.</text>

  <rect x="406" y="412" width="350" height="58" rx="10" fill="#EFF6FF" stroke="#BFDBFE"/>
  <text class="ui" x="424" y="434" font-size="11.5" font-weight="700" fill="#1E40AF">Reject</text>
  <text class="ui" x="424" y="454" font-size="11" fill="#64748B">Missing prompt or feature envelope returns HTTP 400.</text>

  <rect x="772" y="412" width="356" height="58" rx="10" fill="#ECFDF5" stroke="#A7F3D0"/>
  <text class="ui" x="790" y="434" font-size="11.5" font-weight="700" fill="#047857">Execute</text>
  <text class="ui" x="790" y="454" font-size="11" fill="#64748B">COM calls first; keyboard fallback only if the COM call fails.</text>
</svg>
