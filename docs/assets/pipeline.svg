<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="pipe-title pipe-desc">
  <title id="pipe-title">Vulcan request lifecycle</title>
  <desc id="pipe-desc">Seven stages across three lanes. The client sends a natural-language request, the server assembles a versioned prompt, the model returns JSON, the server recovers and validates the tree, and the client shows an editable preview before executing native SolidWorks features. The model call dominates latency; a human confirmation gate sits before execution.</desc>
  <defs>
    <marker id="pp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8A8A83"/>
    </marker>
    <marker id="pr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#C8102E"/>
    </marker>
    <style>
      .ui { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
      .lane { font-size: 10px; font-weight: 700; letter-spacing: 1.8px; fill: #6E6E67; }
      .n { font-size: 10px; font-weight: 700; fill: #FFFFFF; }
      .t { font-size: 12.5px; font-weight: 700; fill: #171717; }
      .d { font-size: 10.2px; fill: #55554F; }
      .m { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 9.6px; fill: #2E2E2E; }
      .note { font-size: 10.4px; fill: #6E6E67; }
    </style>
  </defs>

  <rect width="1200" height="660" fill="#FFFFFF"/>
  <text class="ui" x="1152" y="44" text-anchor="end" font-size="10" font-weight="700" letter-spacing="2" fill="#8A8A83">PROCESS VIEW</text>
  <text class="ui" x="48" y="58" font-size="26" font-weight="700" fill="#171717">Request lifecycle</text>
  <text class="ui" x="48" y="86" font-size="14" fill="#66665F">Seven stages, three lanes, and one human checkpoint before the document is touched.</text>
  <line x1="48" y1="106" x2="1152" y2="106" stroke="#DADAD4"/>

  <!-- lanes -->
  <rect x="40" y="128" width="1120" height="152" fill="#FAFAF8" stroke="#E6E6E0"/>
  <rect x="40" y="300" width="1120" height="152" fill="#FFFFFF" stroke="#E6E6E0"/>
  <rect x="40" y="472" width="1120" height="132" fill="#F4F4F0" stroke="#E6E6E0"/>
  <text class="ui lane" x="56" y="150">CLIENT · WINDOWS / SOLIDWORKS</text>
  <text class="ui lane" x="56" y="322">SERVER · FLASK</text>
  <text class="ui lane" x="56" y="494">MODEL PROVIDER</text>

  <!-- 1 natural language -->
  <rect x="56" y="168" width="180" height="72" fill="#FFFFFF" stroke="#DADAD4"/>
  <circle cx="78" cy="190" r="10" fill="#171717"/><text class="ui n" x="78" y="194" text-anchor="middle">1</text>
  <text class="ui t" x="94" y="194">Natural language</text>
  <text class="ui d" x="72" y="216">Chinese, English, or French</text>
  <text class="ui d" x="72" y="232">request in the task pane.</text>

  <!-- 2 prompt assembly -->
  <rect x="260" y="328" width="180" height="72" fill="#FFFFFF" stroke="#DADAD4"/>
  <circle cx="282" cy="350" r="10" fill="#171717"/><text class="ui n" x="282" y="354" text-anchor="middle">2</text>
  <text class="ui t" x="298" y="354">Prompt assembly</text>
  <text class="ui d" x="276" y="376">Native domain prompt plus</text>
  <text class="ui m" x="276" y="392">PROMPT_VERSION 3.0.0</text>

  <!-- 3 LLM call -->
  <rect x="470" y="508" width="200" height="72" fill="#FFFFFF" stroke="#DADAD4"/>
  <circle cx="492" cy="530" r="10" fill="#171717"/><text class="ui n" x="492" y="534" text-anchor="middle">3</text>
  <text class="ui t" x="508" y="534">LLM call</text>
  <text class="ui d" x="486" y="556">OpenAI-compatible or Anthropic;</text>
  <text class="ui m" x="486" y="572">temp 0.05 · max_tokens 2048 · 30 s</text>

  <!-- 4 recovery -->
  <rect x="520" y="328" width="170" height="72" fill="#FFFFFF" stroke="#DADAD4"/>
  <circle cx="542" cy="350" r="10" fill="#171717"/><text class="ui n" x="542" y="354" text-anchor="middle">4</text>
  <text class="ui t" x="558" y="354">JSON recovery</text>
  <text class="ui d" x="536" y="376">strip fences → first { … }</text>
  <text class="ui d" x="536" y="392">→ parse.</text>

  <!-- 5 validation -->
  <rect x="760" y="328" width="170" height="72" fill="#FFFFFF" stroke="#DADAD4"/>
  <circle cx="782" cy="350" r="10" fill="#171717"/><text class="ui n" x="782" y="354" text-anchor="middle">5</text>
  <text class="ui t" x="798" y="354">Validate</text>
  <text class="ui d" x="776" y="376">envelope · params · geometry</text>
  <text class="ui d" x="776" y="392">HTTP 400 on failure.</text>

  <!-- 6 preview -->
  <rect x="740" y="168" width="170" height="72" fill="#FAEEF0" stroke="#E8C9CE"/>
  <circle cx="762" cy="190" r="10" fill="#C8102E"/><text class="ui n" x="762" y="194" text-anchor="middle">6</text>
  <text class="ui t" x="778" y="194">Preview &amp; edit</text>
  <text class="ui d" x="756" y="216">Editable JSON, live checks;</text>
  <text class="ui d" x="756" y="232">confirm or cancel.</text>

  <!-- 7 execute -->
  <rect x="950" y="168" width="170" height="72" fill="#FFFFFF" stroke="#DADAD4"/>
  <circle cx="972" cy="190" r="10" fill="#171717"/><text class="ui n" x="972" y="194" text-anchor="middle">7</text>
  <text class="ui t" x="988" y="194">COM execution</text>
  <text class="ui m" x="966" y="216">FeatureExtrusion3 · FeatureCut4</text>
  <text class="ui d" x="966" y="232">sketch → native features.</text>

  <!-- flow -->
  <path d="M236 204 H248 V364 H260" fill="none" stroke="#8A8A83" stroke-width="1.3" marker-end="url(#pp)"/>
  <path d="M440 364 H455 V544 H470" fill="none" stroke="#8A8A83" stroke-width="1.3" marker-end="url(#pp)"/>
  <path d="M570 508 V424 H605 V400" fill="none" stroke="#8A8A83" stroke-width="1.3" marker-end="url(#pp)"/>
  <line x1="690" y1="364" x2="760" y2="364" stroke="#8A8A83" stroke-width="1.3" marker-end="url(#pp)"/>
  <line x1="825" y1="328" x2="825" y2="240" stroke="#8A8A83" stroke-width="1.3" marker-end="url(#pp)"/>
  <line x1="910" y1="204" x2="950" y2="204" stroke="#C8102E" stroke-width="1.5" marker-end="url(#pr)"/>

  <!-- latency strip -->
  <line x1="48" y1="618" x2="1152" y2="618" stroke="#E6E6E0"/>
  <text class="ui note" x="48" y="640" font-size="10.4">Typical latency: local stages &lt; 5 ms · model call 2–20 s · human review · COM 0.2–2 s. The model call dominates; everything after the preview is local.</text>
  <text class="ui" x="1152" y="640" text-anchor="end" font-size="9.5" fill="#8A8A83">Guardrails: recover · reject · confirm</text>
</svg>
