<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Vulcan system architecture</title>
  <desc id="arch-desc">A Windows client with SolidWorks, the Vulcan add-in, DPAPI-protected settings, and an editable JSON preview talks to a Python Flask server that validates requests and calls any OpenAI-compatible provider, with optional per-request BYOK headers.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0A0A0A" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="ember" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#B3121F"/><stop offset="1" stop-color="#F87171"/>
    </linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#6E6E73"/>
    </marker>
    <style>
      .ui { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .lane { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #6E6E73; }
      .cardTitle { font-size: 14px; font-weight: 700; fill: #0A0A0A; }
      .cardBody { font-size: 11.5px; fill: #6E6E73; }
      .cardMono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.6px; fill: #3A3A3C; }
      .step { font-size: 10px; font-weight: 700; fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1200" height="560" fill="#FAFAFA"/>
  <rect x="1" y="1" width="1198" height="558" rx="18" fill="#FFFFFF" stroke="#E5E5EA"/>
  <text class="ui" x="48" y="56" font-size="26" font-weight="700" fill="#0A0A0A">System architecture</text>
  <text class="ui" x="48" y="84" font-size="14" fill="#6E6E73">A thin Windows client with local settings and an editable preview; a portable server; a provider-agnostic model layer.</text>

  <!-- lanes -->
  <rect x="40" y="116" width="336" height="366" rx="16" fill="#F2F2F7" stroke="#E5E5EA"/>
  <rect x="432" y="116" width="336" height="366" rx="16" fill="#FAFAFA" stroke="#F2F2F7"/>
  <rect x="824" y="116" width="336" height="366" rx="16" fill="#F2F2F7" stroke="#F2F2F7"/>
  <text class="ui lane" x="64" y="146">WINDOWS WORKSTATION</text>
  <text class="ui lane" x="456" y="146">SERVER · PYTHON</text>
  <text class="ui lane" x="848" y="146">LLM PROVIDER</text>

  <!-- SolidWorks card -->
  <rect x="64" y="160" width="288" height="72" rx="12" fill="#FFFFFF" stroke="#E5E5EA" filter="url(#cardShadow)"/>
  <g transform="translate(82 178)">
    <path d="M4 10L18 2l14 8v18L18 36 4 28z" fill="#E5E5EA" stroke="#8E8E93"/>
    <path d="M4 10l14 8 14-8M18 18v18" fill="none" stroke="#8E8E93"/>
    <path d="M18 2l14 8-14 8-14-8z" fill="#FAFAFA" stroke="#8E8E93"/>
  </g>
  <text class="ui cardTitle" x="128" y="188">SolidWorks 2025</text>
  <text class="ui cardBody" x="128" y="208">Part · COM API · editable feature tree</text>

  <line x1="208" y1="232" x2="208" y2="248" stroke="#6E6E73" stroke-width="1.4" marker-end="url(#a)"/>
  <line x1="220" y1="248" x2="220" y2="232" stroke="#6E6E73" stroke-width="1.4" marker-end="url(#a)"/>
  <text class="ui" x="232" y="244" font-size="10.5" fill="#6E6E73">COM</text>

  <!-- add-in card -->
  <rect x="64" y="252" width="288" height="128" rx="12" fill="#FFFFFF" stroke="#E5E5EA" filter="url(#cardShadow)"/>
  <rect x="82" y="268" width="28" height="28" rx="7" fill="#0A0A0A"/>
  <g>
    <path d="M88 276 L96 290 L104 276" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="104" cy="276" r="2.2" fill="#E11D2E"/>
  </g>
  <text class="ui cardTitle" x="122" y="288">Vulcan add-in</text>
  <text class="ui cardMono" x="82" y="314">C# · WPF · .NET Framework 4.8</text>
  <text class="ui cardBody" x="82" y="336">Tab, toolbar, task pane, status window.</text>
  <text class="ui cardBody" x="82" y="356">Typed JSON → native features; preview before build.</text>
  <rect x="82" y="366" width="106" height="14" rx="7" fill="#FEE2E2"/>
  <text class="ui" x="135" y="377" text-anchor="middle" font-size="9.5" font-weight="700" fill="#7F1D1D">WINDOWS ONLY</text>

  <!-- settings card -->
  <rect x="64" y="392" width="288" height="74" rx="12" fill="#FFFFFF" stroke="#E5E5EA" filter="url(#cardShadow)"/>
  <text class="ui cardTitle" x="82" y="416">Settings · DPAPI</text>
  <text class="ui cardMono" x="82" y="436">%APPDATA%\Vulcan\settings.json</text>
  <text class="ui cardBody" x="82" y="454">server URL · token · BYOK key / base URL / model (encrypted)</text>

  <!-- server cards -->
  <rect x="456" y="160" width="288" height="96" rx="12" fill="#FFFFFF" stroke="#F2F2F7" filter="url(#cardShadow)"/>
  <text class="ui cardTitle" x="476" y="188">Flask API</text>
  <text class="ui cardMono" x="476" y="210">POST /api/v1/generate · SSE /stream</text>
  <text class="ui cardBody" x="476" y="232">Envelope + feature validation · rate limit · SSE</text>

  <line x1="600" y1="258" x2="600" y2="280" stroke="#D1D1D6" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#a)"/>

  <rect x="456" y="284" width="288" height="108" rx="12" fill="#FFFFFF" stroke="#F2F2F7" filter="url(#cardShadow)"/>
  <text class="ui cardTitle" x="476" y="312">LLM client</text>
  <text class="ui cardBody" x="476" y="334">Domain prompt · code-fence repair</text>
  <text class="ui cardBody" x="476" y="354">Per-request BYOK headers: X-LLM-API-Key,</text>
  <text class="ui cardBody" x="476" y="372">X-LLM-Base-URL, X-LLM-Model</text>
  <text class="ui cardBody" x="476" y="388">temperature 0.05 · 30 s timeout</text>

  <rect x="456" y="406" width="288" height="52" rx="10" fill="#F2F2F7" fill-opacity="0.45" stroke="#E5E5EA"/>
  <text class="ui" x="476" y="426" font-size="11.5" font-weight="700" fill="#0A0A0A">.env / settings</text>
  <text class="ui cardBody" x="476" y="444">provider key · base URL · model · custom-URL switch</text>

  <!-- provider cards -->
  <rect x="848" y="160" width="288" height="164" rx="12" fill="#FFFFFF" stroke="#F2F2F7" filter="url(#cardShadow)"/>
  <text class="ui cardTitle" x="868" y="188">OpenAI-compatible API</text>
  <text class="ui cardBody" x="868" y="214">GPT · DeepSeek · Qwen · Qiniu Cloud</text>
  <text class="ui cardBody" x="868" y="234">self-hosted vLLM or Ollama</text>
  <line x1="868" y1="250" x2="1116" y2="250" stroke="#F2F2F7"/>
  <text class="ui cardBody" x="868" y="272">Returns a JSON feature tree.</text>
  <text class="ui cardBody" x="868" y="292">No provider-specific client code.</text>

  <rect x="848" y="344" width="288" height="114" rx="12" fill="#FFFFFF" stroke="#F2F2F7" filter="url(#cardShadow)"/>
  <text class="ui cardTitle" x="868" y="372">Swap without a rebuild</text>
  <text class="ui cardBody" x="868" y="396">Change the base URL and model in .env,</text>
  <text class="ui cardBody" x="868" y="416">or let a client send BYOK headers.</text>
  <text class="ui cardBody" x="868" y="436">Server keys stay server-side; BYOK keys</text>
  <text class="ui cardBody" x="868" y="452">are forwarded per request; never logged.</text>

  <!-- flow arrows -->
  <line x1="400" y1="206" x2="430" y2="206" stroke="#6E6E73" stroke-width="1.6" marker-end="url(#a)"/>
  <circle cx="415" cy="206" r="9" fill="#0A0A0A"/><text class="ui step" x="415" y="209.5" text-anchor="middle">1</text>
  <text class="ui" x="415" y="190" text-anchor="middle" font-size="10" fill="#3A3A3C">prompt + headers</text>

  <line x1="768" y1="206" x2="822" y2="206" stroke="#6E6E73" stroke-width="1.6" marker-end="url(#a)"/>
  <circle cx="795" cy="206" r="9" fill="#0A0A0A"/><text class="ui step" x="795" y="209.5" text-anchor="middle">2</text>
  <text class="ui" x="795" y="190" text-anchor="middle" font-size="10" fill="#3A3A3C">system + user</text>

  <line x1="822" y1="292" x2="768" y2="292" stroke="#6E6E73" stroke-width="1.6" marker-end="url(#a)"/>
  <circle cx="795" cy="292" r="9" fill="#0A0A0A"/><text class="ui step" x="795" y="295.5" text-anchor="middle">3</text>
  <text class="ui" x="795" y="276" text-anchor="middle" font-size="10" fill="#3A3A3C">JSON</text>

  <line x1="430" y1="336" x2="400" y2="336" stroke="#6E6E73" stroke-width="1.6" marker-end="url(#a)"/>
  <circle cx="415" cy="336" r="9" fill="#B3121F"/><text class="ui step" x="415" y="339.5" text-anchor="middle">4</text>
  <text class="ui" x="415" y="320" text-anchor="middle" font-size="10" fill="#3A3A3C">typed JSON</text>

  <text class="ui" x="48" y="520" font-size="12" fill="#6E6E73">The server runs locally, in Docker, or behind a tunnel. The client always runs beside SolidWorks; settings are encrypted per Windows user.</text>
  <text class="ui" x="48" y="540" font-size="11" fill="#8E8E93">Preview and confirmation happen entirely on the client, before any COM call.</text>
</svg>
