<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">Vulcan system architecture</title>
  <desc id="arch-desc">Three lanes: a Windows workstation with SolidWorks, the Vulcan add-in, DPAPI settings, and an editable preview; a Python Flask server that assembles the domain prompt, adapts to OpenAI-compatible or Anthropic APIs, validates the feature tree, and enforces a bearer token and rate limit; and the model provider. Transport is HTTP REST with an SSE stream and optional per-request BYOK headers.</desc>
  <defs>
    <marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#8A8A83"/>
    </marker>
    <style>
      .ui { font-family: "Helvetica Neue", Helvetica, Arial, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
      .lane { font-size: 10px; font-weight: 700; letter-spacing: 1.8px; fill: #6E6E67; }
      .boxTitle { font-size: 13px; font-weight: 700; fill: #171717; }
      .body { font-size: 11px; fill: #55554F; }
      .small { font-size: 10.2px; fill: #6E6E67; }
      .code { font-family: "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; font-size: 9.8px; fill: #2E2E2E; }
      .num { font-size: 10px; font-weight: 700; fill: #FFFFFF; }
      .edge { font-size: 9.6px; fill: #55554F; }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#FFFFFF"/>
  <text class="ui" x="1152" y="44" text-anchor="end" font-size="10" font-weight="700" letter-spacing="2" fill="#8A8A83">COMPONENT VIEW</text>
  <text class="ui" x="48" y="58" font-size="26" font-weight="700" fill="#171717">System architecture</text>
  <text class="ui" x="48" y="86" font-size="14" fill="#66665F">A thin Windows client, a portable server, and a provider-agnostic model layer — joined by one typed contract.</text>
  <line x1="48" y1="106" x2="1152" y2="106" stroke="#DADAD4"/>

  <!-- lanes -->
  <rect x="40" y="152" width="352" height="372" fill="#FAFAF8" stroke="#E6E6E0"/>
  <rect x="432" y="152" width="352" height="372" fill="#FFFFFF" stroke="#E6E6E0"/>
  <rect x="824" y="152" width="336" height="372" fill="#FAFAF8" stroke="#E6E6E0"/>
  <text class="ui lane" x="56" y="178">WINDOWS WORKSTATION</text>
  <text class="ui lane" x="448" y="178">VULCAN SERVER · PYTHON / FLASK</text>
  <text class="ui lane" x="840" y="178">MODEL PROVIDER</text>

  <!-- client -->
  <rect x="56" y="192" width="320" height="62" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui boxTitle" x="72" y="216">SolidWorks 2025</text>
  <text class="ui body" x="72" y="236">Part · assembly · drawing · COM API</text>

  <line x1="216" y1="258" x2="216" y2="274" stroke="#8A8A83" stroke-width="1.1" marker-end="url(#aa)"/>
  <line x1="228" y1="274" x2="228" y2="258" stroke="#8A8A83" stroke-width="1.1" marker-end="url(#aa)"/>
  <text class="ui edge" x="240" y="271">COM</text>

  <rect x="56" y="278" width="320" height="118" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui boxTitle" x="72" y="302">Vulcan add-in</text>
  <text class="code" x="72" y="321">C# · WPF · .NET Framework 4.8 · x64</text>
  <text class="ui body" x="72" y="342">CommandManager tab · toolbar · task pane</text>
  <text class="ui body" x="72" y="360">Typed JSON → native features</text>
  <text class="ui body" x="72" y="378">Editable preview before any write</text>

  <rect x="56" y="410" width="320" height="58" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui boxTitle" x="72" y="432">Settings · DPAPI</text>
  <text class="code" x="72" y="452">%APPDATA%\Vulcan\settings.json</text>

  <rect x="56" y="482" width="320" height="30" fill="#FAEEF0" stroke="#E8C9CE"/>
  <text class="ui" x="72" y="502" font-size="10.2" fill="#7A1230">Human checkpoint: review, edit, or cancel.</text>

  <!-- server -->
  <rect x="448" y="192" width="320" height="76" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui boxTitle" x="464" y="216">Flask API</text>
  <text class="code" x="464" y="236">POST /api/v1/generate · /generate/stream</text>
  <text class="ui small" x="464" y="256" font-size="10">bearer token · per-IP rate limit · 64 KB body</text>

  <rect x="448" y="284" width="320" height="76" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui boxTitle" x="464" y="308">Prompt assembly</text>
  <text class="ui body" x="464" y="330">Native Chinese / English / French domain</text>
  <text class="ui body" x="464" y="348">prompts; language is explicit or detected.</text>

  <rect x="448" y="376" width="320" height="76" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui boxTitle" x="464" y="400">Provider adapter</text>
  <text class="code" x="464" y="420">OpenAI-compatible: /chat/completions</text>
  <text class="code" x="464" y="438">Anthropic Messages: /messages</text>

  <rect x="448" y="468" width="320" height="56" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui boxTitle" x="464" y="490">Validation</text>
  <text class="ui body" x="464" y="510">envelope · params · geometry vs base block</text>

  <!-- provider -->
  <rect x="840" y="192" width="304" height="112" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui boxTitle" x="856" y="216">OpenAI-compatible API</text>
  <text class="ui body" x="856" y="240">GPT · DeepSeek · Qwen · vLLM · Ollama</text>
  <text class="ui body" x="856" y="260">Qiniu Cloud · any /chat/completions</text>
  <text class="ui body" x="856" y="286">Returns a JSON feature tree.</text>

  <rect x="840" y="320" width="304" height="86" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui boxTitle" x="856" y="344">Anthropic Messages API</text>
  <text class="ui body" x="856" y="366">/messages · x-api-key header</text>
  <text class="ui body" x="856" y="386">No temperature or top_p sent.</text>

  <rect x="840" y="422" width="304" height="90" fill="#FFFFFF" stroke="#DADAD4"/>
  <text class="ui boxTitle" x="856" y="446">Swap without a rebuild</text>
  <text class="ui body" x="856" y="468">Change the base URL and model in .env,</text>
  <text class="ui body" x="856" y="486">or let a client send per-request BYOK headers.</text>
  <text class="ui small" x="856" y="504" font-size="9.8">No provider SDK; one request-based client.</text>

  <!-- lane arrows -->
  <line x1="392" y1="230" x2="428" y2="230" stroke="#8A8A83" stroke-width="1.3" marker-end="url(#aa)"/>
  <circle cx="410" cy="230" r="9" fill="#171717"/><text class="ui num" x="410" y="234" text-anchor="middle">1</text>
  <text class="ui edge" x="410" y="216" text-anchor="middle">prompt + headers</text>

  <line x1="784" y1="230" x2="820" y2="230" stroke="#8A8A83" stroke-width="1.3" marker-end="url(#aa)"/>
  <circle cx="802" cy="230" r="9" fill="#171717"/><text class="ui num" x="802" y="234" text-anchor="middle">2</text>
  <text class="ui edge" x="802" y="216" text-anchor="middle">system + user</text>

  <line x1="820" y1="460" x2="788" y2="460" stroke="#8A8A83" stroke-width="1.3" marker-end="url(#aa)"/>
  <circle cx="802" cy="460" r="9" fill="#171717"/><text class="ui num" x="802" y="464" text-anchor="middle">3</text>
  <text class="ui edge" x="802" y="446" text-anchor="middle">JSON tree</text>

  <line x1="432" y1="496" x2="400" y2="496" stroke="#8A8A83" stroke-width="1.3" marker-end="url(#aa)"/>
  <circle cx="414" cy="496" r="9" fill="#C8102E"/><text class="ui num" x="414" y="500" text-anchor="middle">4</text>
  <text class="ui edge" x="414" y="482" text-anchor="middle">typed JSON</text>

  <!-- transport strip -->
  <rect x="40" y="544" width="1120" height="34" fill="#F4F4F0" stroke="#E6E6E0"/>
  <text class="ui" x="600" y="566" text-anchor="middle" font-size="10.8" fill="#3A3A36">Transport · HTTP REST + SSE · bearer token · per-request BYOK headers · HTTPS required for non-loopback hosts</text>

  <text class="ui small" x="48" y="604" font-size="10.5">The server runs locally, in Docker, or behind a TLS reverse proxy. The client always runs beside SolidWorks. Keys stay server-side unless BYOK is enabled.</text>
</svg>
