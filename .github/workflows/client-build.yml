name: Client build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7
      - uses: microsoft/setup-msbuild@v3
      - name: Restore NuGet packages
        run: nuget restore client/Vulcan.SolidWorksClient/Vulcan.SolidWorksClient.sln
      - name: Build x64 Release
        run: msbuild client/Vulcan.SolidWorksClient/Vulcan.SolidWorksClient.sln /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Build client validator tests
        run: msbuild client/tests/Vulcan.Client.Tests/Vulcan.Client.Tests.csproj /p:Configuration=Release /p:Platform=x64 /v:minimal
      - name: Run client validator tests
        run: client/tests/Vulcan.Client.Tests/bin/x64/Release/Vulcan.Client.Tests.exe
