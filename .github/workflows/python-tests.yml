name: Python tests

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install linters
        run: |
          python -m pip install --upgrade pip
          pip install -r server/requirements-dev.txt
      - name: Ruff
        run: ruff check server tools
      - name: Black
        run: black --check server tools
      - name: mypy
        run: mypy server

  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Run tests
        run: pytest --cov=app --cov=config --cov=services --cov=utils --cov=prompts --cov-report=term-missing --cov-fail-under=85
      - name: Audit dependencies
        run: pip-audit -r requirements.txt
